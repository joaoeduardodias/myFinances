<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myFinances</title>
    <script>
      // Aplica o tema antes do React montar, para o claro não piscar. Mesma
      // chave e mesmo padrão (escuro) de theme-provider.tsx.
      try {
        var t = localStorage.getItem('myfinances-theme')
        if (t !== 'light' && t !== 'system') t = 'dark'
        var dark =
          t === 'dark' ||
          window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
